mascot:
    label: Your creative buddy
    close: Close
    cta: Create a new initiative
    farewell: "See you around — I'm here whenever you need me! 👋"
    welcome: "Yay, I'm back! Let's make something together. 🌟"
    praise: "{1}You've created one initiative — nice start! 🌟|]1,Inf[You've created %count% initiatives — great work! 🌟"
    finish:
        almost: "“%title%” is %percent%% done — want to finish it off?"
        touches: "“%title%” is %percent%% there and just needs its final touches. ✏️"
