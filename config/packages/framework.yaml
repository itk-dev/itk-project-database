# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'

  # Behind the Traefik -> nginx reverse proxy, trust the forwarded headers so URLs
  # are generated with the original https scheme. nginx's real_ip rewrites REMOTE_ADDR
  # to the real client, so REMOTE_ADDR is the address to trust here.
  trusted_proxies: '%env(TRUSTED_PROXIES)%'
  trusted_headers:
    [
      'x-forwarded-for',
      'x-forwarded-host',
      'x-forwarded-proto',
      'x-forwarded-port',
      'x-forwarded-prefix',
    ]

  # Note that the session will be started ONLY if you read or write from it.
  session: true

  #esi: true
  #fragments: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
